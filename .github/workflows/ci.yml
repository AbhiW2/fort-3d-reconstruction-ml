name: CI and GHCR publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  API_IMAGE: ghcr.io/abhiw2/fort-3d-reconstruction-ml-api
  WEB_IMAGE: ghcr.io/abhiw2/fort-3d-reconstruction-ml-web

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Fort_project/requirements-api.txt

      - name: Install system libraries (OpenCV needs these)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies (CPU-only torch, same as Dockerfile)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r Fort_project/requirements-api.txt

      # main.py checks that the YOLO weights file exists at startup.
      # The tests patch YOLO itself, so an empty placeholder file is enough.
      - name: Create placeholder YOLO weights file
        run: |
          mkdir -p Fort_project/models/yolo
          touch Fort_project/models/yolo/gateway_best.pt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest Fort_project/tests/test_rag_api.py -v

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fort_project/app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Fort_project/app/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  publish:
    name: Build and push images to GHCR
    needs: [test-api, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./Fort_project
          file: ./Fort_project/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./Fort_project/app/frontend
          file: ./Fort_project/app/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web