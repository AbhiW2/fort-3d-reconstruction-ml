name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-char commit SHA to deploy (leave empty for the latest commit on main)"
        required: false
        type: string

permissions:
  id-token: write   # needed for AWS OIDC login
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/abhiw2/fort-3d-reconstruction-ml-api
  WEB_IMAGE: ghcr.io/abhiw2/fort-3d-reconstruction-ml-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image tag
        run: |
          SHA="${{ inputs.commit_sha || github.sha }}"
          if [[ ! "$SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "commit_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "IMAGE_TAG=sha-$SHA" >> "$GITHUB_ENV"

      - name: Check both images exist in GHCR
        run: |
          docker manifest inspect "$API_IMAGE:$IMAGE_TAG" > /dev/null
          docker manifest inspect "$WEB_IMAGE:$IMAGE_TAG" > /dev/null
          echo "Both images found for $IMAGE_TAG"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deploy command to EC2 through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # tr removes Windows CR characters so bash on Linux can run the script
          B64=$(tr -d '\r' < Fort_project/scripts/deploy-ec2.sh | base64 -w0)
          jq -n --arg b64 "$B64" --arg tag "$IMAGE_TAG" \
            '{commands: ["echo \($b64) | base64 -d > /tmp/deploy-ec2.sh", "IMAGE_TAG=\($tag) bash /tmp/deploy-ec2.sh"]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $IMAGE_TAG" \
            --timeout-seconds 1500 \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $CMD_ID"

          STATUS="Pending"
          for i in $(seq 1 180); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "[$i] status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "----- EC2 output -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "----- EC2 errors -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with status: $STATUS" >&2
            exit 1
          fi
          echo "Deployed $IMAGE_TAG successfully"